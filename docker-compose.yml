services:
  uni_pg:
    image: postgres:18-alpine
    container_name: inventory_engine_postgres
    restart: always
    ports:
      - "5555:5432"
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - inventory_engine_postgres_data:/var/lib/postgresql/
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: invetory_engine_rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - inventory_engine_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  inventory_engine_postgres_data:
  inventory_engine_rabbitmq_data:

