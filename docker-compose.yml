services:
  uni_pg:
    image: postgres:18-alpine
    container_name: inventory_engine_postgres
    restart: always
    ports:
      - "5555:5432"
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - inventory_engine_postgres_data:/var/lib/postgresql/
volumes:
  inventory_engine_postgres_data:

